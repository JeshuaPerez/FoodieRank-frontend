<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FoodieRank</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/formularios.css">
</head>
<body>
    <header class="encabezado">
        <div class="contenedor">
            <a href="../index.html" class="logo">FoodieRank</a>
            <nav class="nav-principal">
                <a href="../index.html">Inicio</a>
                <a href="busqueda.html">Buscar</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="pagina-auth">
            <div class="plato-decorativo"></div>
            <img src="../assets/img/tenedor.svg" alt="" class="cubierto cubierto--tenedor">
            <img src="../assets/img/cuchillo.svg" alt="" class="cubierto cubierto--cuchillo">

            <div class="tarjeta-auth">
                <h1>Crear cuenta</h1>
                <p class="tarjeta-auth__subtitulo">Únete a FoodieRank y empieza a calificar tus restaurantes favoritos</p>

                <div id="mensaje-general" hidden></div>

                <form id="form-registro" novalidate>
                    <div class="campo-formulario">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="60">
                        <span class="mensaje-error-campo" id="error-nombre" hidden></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                        <span class="mensaje-error-campo" id="error-email" hidden></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required minlength="8" maxlength="72">
                        <span class="mensaje-error-campo" id="error-password" hidden></span>
                    </div>

                    <button type="submit" class="btn btn-primario">Crear cuenta</button>
                </form>

                <p class="enlace-alternativo">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </main>

    <footer class="pie">
        <div class="contenedor">
            <p>&copy; 2026 FoodieRank. Proyecto académico.</p>
        </div>
    </footer>

    <script src="../js/api/config.js" defer></script>
    <script src="../js/api/auth.js" defer></script>
    <script src="../js/ui/auth.js" defer></script>
</body>
</html>
